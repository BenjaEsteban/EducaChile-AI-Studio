services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${DOCKERHUB_API_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-educachile-assets}
      AZURE_STORAGE_PUBLIC_BASE_URL: ${AZURE_STORAGE_PUBLIC_BASE_URL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      WAVESPEED_BASE_URL: ${WAVESPEED_BASE_URL:-https://api.wavespeed.ai/api/v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ALLOW_DUMMY_TTS: ${ALLOW_DUMMY_TTS:-false}
      AVATAR_GENERATION_MODE: ${AVATAR_GENERATION_MODE:-image_audio_infinitetalk}
      AVATAR_IMAGE_AUDIO_PROVIDER: ${AVATAR_IMAGE_AUDIO_PROVIDER:-wavespeed-ai/infinitetalk-fast}
      AVATAR_BASE_VIDEO_PROVIDER: ${AVATAR_BASE_VIDEO_PROVIDER:-wavespeed_infinitetalk_fast}
      AVATAR_LIPSYNC_PROVIDER: ${AVATAR_LIPSYNC_PROVIDER:-wavespeed_sync_lipsync_3}
      AVATAR_SYNC_MODE: ${AVATAR_SYNC_MODE:-loop}
      AVATAR_LIPSYNC_MODEL_PATH: ${AVATAR_LIPSYNC_MODEL_PATH:-wavespeed-ai/sync-lipsync-3}
      AVATAR_BASE_VIDEO_DURATION_SECONDS: ${AVATAR_BASE_VIDEO_DURATION_SECONDS:-8}
      AVATAR_LIPSYNC_RESOLUTION: ${AVATAR_LIPSYNC_RESOLUTION:-480p}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-es}
      TTS_SPEED: ${TTS_SPEED:-0.85}
      ENABLE_SUBTITLES: ${ENABLE_SUBTITLES:-false}
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
      WAVESPEED_HTTP_TIMEOUT_SECONDS: ${WAVESPEED_HTTP_TIMEOUT_SECONDS:-300}
      WAVESPEED_PREDICTION_TIMEOUT_SECONDS: ${WAVESPEED_PREDICTION_TIMEOUT_SECONDS:-1800}
      WAVESPEED_POLL_INTERVAL_SECONDS: ${WAVESPEED_POLL_INTERVAL_SECONDS:-8}
      REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION: ${REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION:-true}
      MAX_TTS_CHARS_PER_CHUNK: ${MAX_TTS_CHARS_PER_CHUNK:-700}
      MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK: ${MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK:-600}
      MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK: ${MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_CHUNKS_PER_SLIDE: ${MAX_CHUNKS_PER_SLIDE:-3}
      AVATAR_SLIDE_CONCURRENCY: ${AVATAR_SLIDE_CONCURRENCY:-2}
      AVATAR_CHUNK_CONCURRENCY: ${AVATAR_CHUNK_CONCURRENCY:-2}
      AVATAR_PROVIDER_SLIDE_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_SLIDE_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_MAX_RETRIES: ${AVATAR_PROVIDER_MAX_RETRIES:-1}
      ENABLE_STATIC_AVATAR_FALLBACK: ${ENABLE_STATIC_AVATAR_FALLBACK:-true}
      MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS: ${MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS:-1.0}
      MIN_EXPECTED_AUDIO_DURATION_RATIO: ${MIN_EXPECTED_AUDIO_DURATION_RATIO:-0.5}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-3300}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-3600}
      DEFAULT_LIPSYNC_MODEL: ${DEFAULT_LIPSYNC_MODEL:-wavespeed-ai/ltx-2-19b/lipsync}
      FALLBACK_LIPSYNC_MODEL: ${FALLBACK_LIPSYNC_MODEL:-}
      LIPSYNC_PROMPT: ${LIPSYNC_PROMPT:-A front-facing presenter speaking naturally, visible mouth movement, subtle natural head motion, realistic lip sync, stable face, well-lit portrait.}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ${DOCKERHUB_API_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-educachile-assets}
      AZURE_STORAGE_PUBLIC_BASE_URL: ${AZURE_STORAGE_PUBLIC_BASE_URL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      WAVESPEED_BASE_URL: ${WAVESPEED_BASE_URL:-https://api.wavespeed.ai/api/v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ALLOW_DUMMY_TTS: ${ALLOW_DUMMY_TTS:-false}
      AVATAR_GENERATION_MODE: ${AVATAR_GENERATION_MODE:-image_audio_infinitetalk}
      AVATAR_IMAGE_AUDIO_PROVIDER: ${AVATAR_IMAGE_AUDIO_PROVIDER:-wavespeed-ai/infinitetalk-fast}
      AVATAR_BASE_VIDEO_PROVIDER: ${AVATAR_BASE_VIDEO_PROVIDER:-wavespeed_infinitetalk_fast}
      AVATAR_LIPSYNC_PROVIDER: ${AVATAR_LIPSYNC_PROVIDER:-wavespeed_sync_lipsync_3}
      AVATAR_SYNC_MODE: ${AVATAR_SYNC_MODE:-loop}
      AVATAR_LIPSYNC_MODEL_PATH: ${AVATAR_LIPSYNC_MODEL_PATH:-wavespeed-ai/sync-lipsync-3}
      AVATAR_BASE_VIDEO_DURATION_SECONDS: ${AVATAR_BASE_VIDEO_DURATION_SECONDS:-8}
      AVATAR_LIPSYNC_RESOLUTION: ${AVATAR_LIPSYNC_RESOLUTION:-480p}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-es}
      TTS_SPEED: ${TTS_SPEED:-0.85}
      ENABLE_SUBTITLES: ${ENABLE_SUBTITLES:-false}
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
      WAVESPEED_HTTP_TIMEOUT_SECONDS: ${WAVESPEED_HTTP_TIMEOUT_SECONDS:-300}
      WAVESPEED_PREDICTION_TIMEOUT_SECONDS: ${WAVESPEED_PREDICTION_TIMEOUT_SECONDS:-1800}
      WAVESPEED_POLL_INTERVAL_SECONDS: ${WAVESPEED_POLL_INTERVAL_SECONDS:-8}
      REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION: ${REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION:-true}
      MAX_TTS_CHARS_PER_CHUNK: ${MAX_TTS_CHARS_PER_CHUNK:-700}
      MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK: ${MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK:-600}
      MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK: ${MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_CHUNKS_PER_SLIDE: ${MAX_CHUNKS_PER_SLIDE:-3}
      AVATAR_SLIDE_CONCURRENCY: ${AVATAR_SLIDE_CONCURRENCY:-2}
      AVATAR_CHUNK_CONCURRENCY: ${AVATAR_CHUNK_CONCURRENCY:-2}
      AVATAR_PROVIDER_SLIDE_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_SLIDE_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_MAX_RETRIES: ${AVATAR_PROVIDER_MAX_RETRIES:-1}
      ENABLE_STATIC_AVATAR_FALLBACK: ${ENABLE_STATIC_AVATAR_FALLBACK:-true}
      MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS: ${MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS:-1.0}
      MIN_EXPECTED_AUDIO_DURATION_RATIO: ${MIN_EXPECTED_AUDIO_DURATION_RATIO:-0.5}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-3300}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-3600}
      DEFAULT_LIPSYNC_MODEL: ${DEFAULT_LIPSYNC_MODEL:-wavespeed-ai/ltx-2-19b/lipsync}
      FALLBACK_LIPSYNC_MODEL: ${FALLBACK_LIPSYNC_MODEL:-}
      LIPSYNC_PROMPT: ${LIPSYNC_PROMPT:-A front-facing presenter speaking naturally, visible mouth movement, subtle natural head motion, realistic lip sync, stable face, well-lit portrait.}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --queues=default,presentations,generation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    image: ${DOCKERHUB_WEB_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
