services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      EXTERNAL_PROVIDER_ASSET_BASE_URL: ${EXTERNAL_PROVIDER_ASSET_BASE_URL:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      WAVESPEED_BASE_URL: ${WAVESPEED_BASE_URL:-https://api.wavespeed.ai/api/v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ALLOW_DUMMY_TTS: ${ALLOW_DUMMY_TTS:-false}
      AVATAR_GENERATION_MODE: ${AVATAR_GENERATION_MODE:-fast_lipsync}
      AVATAR_LIPSYNC_PROVIDER: ${AVATAR_LIPSYNC_PROVIDER:-wavespeed_sync_lipsync_3}
      AVATAR_SYNC_MODE: ${AVATAR_SYNC_MODE:-loop}
      AVATAR_LIPSYNC_MODEL_PATH: ${AVATAR_LIPSYNC_MODEL_PATH:-wavespeed-ai/sync-lipsync-3}
      AVATAR_LIPSYNC_RESOLUTION: ${AVATAR_LIPSYNC_RESOLUTION:-480p}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-es}
      TTS_SPEED: ${TTS_SPEED:-0.85}
      ENABLE_SUBTITLES: ${ENABLE_SUBTITLES:-false}
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
      WAVESPEED_HTTP_TIMEOUT_SECONDS: ${WAVESPEED_HTTP_TIMEOUT_SECONDS:-300}
      WAVESPEED_PREDICTION_TIMEOUT_SECONDS: ${WAVESPEED_PREDICTION_TIMEOUT_SECONDS:-1800}
      WAVESPEED_POLL_INTERVAL_SECONDS: ${WAVESPEED_POLL_INTERVAL_SECONDS:-8}
      REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION: ${REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION:-true}
      MAX_TTS_CHARS_PER_CHUNK: ${MAX_TTS_CHARS_PER_CHUNK:-700}
      MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK: ${MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK: ${MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_CHUNKS_PER_SLIDE: ${MAX_CHUNKS_PER_SLIDE:-4}
      AVATAR_CHUNK_CONCURRENCY: ${AVATAR_CHUNK_CONCURRENCY:-2}
      AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_MAX_RETRIES: ${AVATAR_PROVIDER_MAX_RETRIES:-1}
      ENABLE_STATIC_AVATAR_FALLBACK: ${ENABLE_STATIC_AVATAR_FALLBACK:-true}
      MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS: ${MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS:-1.0}
      MIN_EXPECTED_AUDIO_DURATION_RATIO: ${MIN_EXPECTED_AUDIO_DURATION_RATIO:-0.5}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-3300}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-3600}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      EXTERNAL_PROVIDER_ASSET_BASE_URL: ${EXTERNAL_PROVIDER_ASSET_BASE_URL:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      WAVESPEED_BASE_URL: ${WAVESPEED_BASE_URL:-https://api.wavespeed.ai/api/v3}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      ALLOW_DUMMY_TTS: ${ALLOW_DUMMY_TTS:-false}
      AVATAR_GENERATION_MODE: ${AVATAR_GENERATION_MODE:-fast_lipsync}
      AVATAR_LIPSYNC_PROVIDER: ${AVATAR_LIPSYNC_PROVIDER:-wavespeed_sync_lipsync_3}
      AVATAR_SYNC_MODE: ${AVATAR_SYNC_MODE:-loop}
      AVATAR_LIPSYNC_MODEL_PATH: ${AVATAR_LIPSYNC_MODEL_PATH:-wavespeed-ai/sync-lipsync-3}
      AVATAR_LIPSYNC_RESOLUTION: ${AVATAR_LIPSYNC_RESOLUTION:-480p}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-es}
      TTS_SPEED: ${TTS_SPEED:-0.85}
      ENABLE_SUBTITLES: ${ENABLE_SUBTITLES:-false}
      FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
      WAVESPEED_HTTP_TIMEOUT_SECONDS: ${WAVESPEED_HTTP_TIMEOUT_SECONDS:-300}
      WAVESPEED_PREDICTION_TIMEOUT_SECONDS: ${WAVESPEED_PREDICTION_TIMEOUT_SECONDS:-1800}
      WAVESPEED_POLL_INTERVAL_SECONDS: ${WAVESPEED_POLL_INTERVAL_SECONDS:-8}
      REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION: ${REQUIRE_EXTERNAL_PROVIDER_URL_VALIDATION:-true}
      MAX_TTS_CHARS_PER_CHUNK: ${MAX_TTS_CHARS_PER_CHUNK:-700}
      MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK: ${MAX_LIPSYNC_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK: ${MAX_AVATAR_AUDIO_SECONDS_PER_CHUNK:-30}
      MAX_CHUNKS_PER_SLIDE: ${MAX_CHUNKS_PER_SLIDE:-4}
      AVATAR_CHUNK_CONCURRENCY: ${AVATAR_CHUNK_CONCURRENCY:-2}
      AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS: ${AVATAR_PROVIDER_CHUNK_TIMEOUT_SECONDS:-300}
      AVATAR_PROVIDER_MAX_RETRIES: ${AVATAR_PROVIDER_MAX_RETRIES:-1}
      ENABLE_STATIC_AVATAR_FALLBACK: ${ENABLE_STATIC_AVATAR_FALLBACK:-true}
      MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS: ${MAX_AUDIO_CHUNK_DURATION_TOLERANCE_SECONDS:-1.0}
      MIN_EXPECTED_AUDIO_DURATION_RATIO: ${MIN_EXPECTED_AUDIO_DURATION_RATIO:-0.5}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-3300}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-3600}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --queues=default,presentations,generation
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app

  # ── Frontend ──────────────────────────────────────────────────────────────

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - WATCHPACK_POLLING=true
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web/src:/app/src 
      - ./apps/web/public:/app/public
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next_cache:
